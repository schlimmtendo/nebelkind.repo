name: Build and publish Nebelkind Kodi index
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'repository.nebelkind/**'
      - 'assets/nebelkind-logo.svg'
      - 'tools/build_repository.py'
      - 'tools/enforce_skin_dependency.py'
      - 'tools/import_upload.py'
      - 'tools/build_overrides.py'
      - 'tools/prune_verified_releases.py'
      - 'tools/test_release_pipeline.py'
      - 'tools/test_update_monitor.py'
      - 'tools/check_repository_consistency.py'
      - 'overrides/**'
      - 'release_versions.json'
      - 'nebelkind-paket.zip'
      - '.github/workflows/prepare.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'overrides/**'
      - 'release_versions.json'
      - '.github/workflows/prepare.yml'
  workflow_dispatch:
# Serialize publishing so two updates cannot overwrite each other's commits.
concurrency:
  group: nebelkind-publish-main
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: pip install Pillow cairosvg
      - name: Verify Kodi release safety with synthetic addon ZIPs
        run: python tools/test_release_pipeline.py
      - name: Test automatic Nebelkind update watcher
        run: python tools/test_update_monitor.py
      - name: Import owner-uploaded Nebelkind package (if present)
        run: python tools/import_upload.py
      - name: Build changed addon ZIPs from Github source overrides
        run: python tools/build_overrides.py
      - name: Apply NebelFlix Skin dependency rules
        run: python tools/enforce_skin_dependency.py
      - name: Validate addon ZIPs and rebuild repository
        run: python tools/build_repository.py
      - name: Verify published Kodi metadata, artwork, dependencies, ZIPs and checksums
        run: python tools/check_repository_consistency.py
      - name: Validate full release and retire only superseded ZIPs
        run: python tools/prune_verified_releases.py
      - name: Publish verified files in a single atomic commit
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Nebelkind releases and retire older ZIPs'
            git push origin HEAD:main
          fi
