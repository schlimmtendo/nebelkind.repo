name: Build and publish Nebelkind Kodi index
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'repository.nebelkind/**'
      - 'assets/nebelkind-logo.svg'
      - 'tools/build_repository.py'
      - 'tools/enforce_skin_dependency.py'
      - '.github/workflows/prepare.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: pip install Pillow cairosvg
      - name: Apply NebelFlix Skin dependency rules
        run: python tools/enforce_skin_dependency.py
      - name: Validate addon ZIPs and rebuild repository
        run: python tools/build_repository.py
      - name: Publish generated files on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repository.nebelkind/icon.png repository.nebelkind/fanart.jpg packages/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Nebelkind Kodi packages and index'
            git push origin HEAD:main
          fi
