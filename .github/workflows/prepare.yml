name: Prepare Kodi repository (testing only)

on:
  push:
    branches: [testing]
    paths:
      - 'packages/**'
      - 'repository.nebelkind/**'
      - 'tools/build_repository.py'
      - '.github/workflows/prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate packages and build index
        run: python tools/build_repository.py
      - name: Commit prepared files to testing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/
          if ! git diff --cached --quiet; then
            git commit -m 'Build Kodi index for testing'
            git push origin HEAD:testing
          fi
